name: Move pages from the old address
on:
  push:
    paths: ['.github/workflows/move.yml']
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy and rewrite
        run: |
          cat > /tmp/move.py <<'PY'
          import os, re, sys, urllib.request
          V='https://pushti-shah.vercel.app/'; G='https://shah-pushti.github.io'
          MAP={'index':'','experience':'#path','research':'#evidence','articles':'#writing','contact':'#contact'}
          ROOT=['oral-cancer-in-numbers.html','oral-cancer-screening-kerala-trial.html','mouth-self-check.html','404.html','site.css','site.js','Pushti-Shah-CV.pdf','og.png',
                'fonts/inter-regular.woff','fonts/inter-semibold.woff','fonts/lmroman12.woff','fonts/lmroman17.woff']
          DE=['de/index.html','de/experience.html','de/research.html','de/articles.html','de/contact.html']
          def get(p):
              u=V+('de/' if p=='de/index.html' else p)
              return urllib.request.urlopen(u).read()
          def fix(t,de):
              t=t.replace('https://pushti-shah.vercel.app',G)
              t=re.sub(r'https://shah-pushti\.github\.io/(experience|research|contact|articles)\.html',G+'/',t)
              t=re.sub(r'https://shah-pushti\.github\.io/index\.html',G+'/',t)
              if de: t=re.sub(r'href="\.\./(index|experience|research|articles|contact)\.html(#[^"]*)?"',lambda m:'href="../'+MAP[m.group(1)]+'"',t)
              else:  t=re.sub(r'href="(index|experience|research|articles|contact)\.html(#[^"]*)?"',lambda m:'href="./'+MAP[m.group(1)]+'"',t)
              t=re.sub(r'href="/(index|experience|research|articles|contact)\.html"',lambda m:'href="/'+MAP[m.group(1)]+'"',t)
              t=re.sub(r'<span class="status">Draft: not yet checked by Pushti Shah</span>','',t)
              if '404' not in t[:2000]: pass
              t=t.replace('rel="me noopener">LinkedIn</a>','rel="me noopener">LinkedIn</a> &nbsp; <a href="https://github.com/shah-pushti" rel="me noopener">GitHub</a>')
              return t
          src=sys.argv[1] if len(sys.argv)>1 else None
          for p in ROOT+DE:
              data=open(os.path.join(src,p),'rb').read() if src else get(p)
              if p.endswith('.html'):
                  t=fix(data.decode(),p.startswith('de/'))
                  if p!='404.html': t=t.replace('<meta name="robots" content="noindex">\n','').replace('<meta name="robots" content="noindex">','')
                  data=t.encode()
              os.makedirs(os.path.dirname(p) or '.',exist_ok=True); open(p,'wb').write(data)
          # home page
          h=open('index.html').read()
          for a in ['oral-cancer-in-numbers.html','oral-cancer-screening-kerala-trial.html','mouth-self-check.html']:
              h=h.replace('https://pushti-shah.vercel.app/'+a,a)
          h=h.replace('https://pushti-shah.vercel.app/Pushti-Shah-CV.pdf','Pushti-Shah-CV.pdf')
          h=h.replace(' · German pages: <a href="https://pushti-shah.vercel.app/de/">pushti-shah.vercel.app</a>',' · <a href="de/" lang="de" hreflang="de">Deutsch</a>')
          h=h.replace('    <a href="#contact">Contact</a>\n  </nav>','    <a href="#contact">Contact</a>\n    <a href="de/" lang="de" hreflang="de">Deutsch</a>\n  </nav>')
          h=h.replace('<link rel="canonical" href="https://shah-pushti.github.io/">','<link rel="canonical" href="https://shah-pushti.github.io/">\n<link rel="alternate" hreflang="en" href="https://shah-pushti.github.io/">\n<link rel="alternate" hreflang="de" href="https://shah-pushti.github.io/de/">\n<meta property="og:image" content="https://shah-pushti.github.io/og.png">')
          open('index.html','w').write(h)
          urls=['','de/','de/experience.html','de/research.html','de/articles.html','de/contact.html','oral-cancer-in-numbers.html','oral-cancer-screening-kerala-trial.html','mouth-self-check.html']
          open('sitemap.xml','w').write('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+''.join(f'  <url><loc>{G}/{u}</loc></url>\n' for u in urls)+'</urlset>\n')
          PY
          python3 /tmp/move.py
      - name: Commit
        run: |
          git config user.name "Pushti Shah"
          git config user.email "shah-pushti@users.noreply.github.com"
          git add -A
          git reset -q .github
          git commit -m "Add articles, German pages and CV" && git push
