name: Remove dissertation mark
on:
  push:
    paths: ['.github/workflows/fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit pages and CV
        run: |
          pip install pikepdf==9.* >/dev/null
          cat > /tmp/fix.py <<'PY'
          import re, pikepdf
          def rep(path, pairs):
              t=open(path,encoding='utf-8').read()
              for a,b,n in pairs:
                  c=t.count(a); assert c==n, (path,a,c); t=t.replace(a,b)
              assert '90 out of 100' not in t and '90 von 100' not in t, path
              open(path,'w',encoding='utf-8').write(t)
          Q='This comparison is the basis of my research question on whether a publicly covered dental check-up includes an examination of the oral mucosa.'
          QD='Dieser Vergleich ist die Grundlage meiner Forschungsfrage, ob die gesetzlich finanzierte zahnärztliche Kontrolluntersuchung eine Untersuchung der Mundschleimhaut einschließt.'
          rep('index.html',[('6 European Countries”. Mark: 90 out of 100.</p>','6 European Countries”. '+Q+'</p>',1),
                            ('cover dental treatment. Mark: 90 out of 100.</p>','cover dental treatment.</p>',1)])
          rep('de/experience.html',[('6 European Countries“. Bewertung: 90 von 100 Punkten.</p>','6 European Countries“. '+QD+'</p>',1)])
          rep('de/index.html',[(' Bewertung: 90 von 100 Punkten.</p>','</p>',1)])
          rep('de/research.html',[(' Bewertung: 90 von 100 Punkten.</p>','</p>',1)])
          pdf=pikepdf.open('Pushti-Shah-CV.pdf',allow_overwriting_input=True)
          p=pdf.pages[0]; s=p.Contents.read_bytes()
          a=b'(in 6 European Countries". Mark: 90 out of 100.)'; assert s.count(a)==1
          p.Contents.write(s.replace(a,b'(in 6 European Countries".)'))
          pdf.save('Pushti-Shah-CV.pdf')
          PY
          python3 /tmp/fix.py
      - name: Commit
        run: |
          git config user.name "Pushti Shah"
          git config user.email "shah-pushti@users.noreply.github.com"
          git add -A
          git reset -q .github
          git commit -m "Describe the dissertation by its purpose" && git push
